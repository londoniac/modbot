<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configure AutoRules Bot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <nav class="container">
    <div class="logo"><strong>ModBot.io</strong></div>
    <div class="nav-links">
      <a href="bots.html">Back to Bots</a>
    </div>
  </nav>
</header>
<main class="container">
  <h1>AutoRules Bot Configuration</h1>
  <form>
    <label for="min-words">Minimum Word Count</label>
    <input type="number" id="min-words" value="50" />
    <label for="require-flair">Require Flair</label>
    <input type="checkbox" id="require-flair" checked />
    <button type="submit" class="button">Save Settings</button>
  </form>
</main>
</body>
</html>
