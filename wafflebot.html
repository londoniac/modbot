<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configure WaffleBot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <nav class="container">
    <strong>ModBot.io</strong>
    <div class="nav-links">
      <a href="bots.html">Back to Bots</a>
    </div>
  </nav>
</header>
<main class="container">
  <h1>WaffleBot Settings</h1>
  <p>Customize how WaffleBot surfaces an author’s posting history:</p>
  <form>
    <label for="history-limit">Number of Past Posts to Show</label>
    <input type="number" id="history-limit" value="3" />

    <label for="link-format">Link Format</label>
    <select id="link-format">
      <option>Markdown Links</option>
      <option>Plain URLs</option>
    </select>

    <label for="intro-message">Intro Message</label>
    <textarea id="intro-message" placeholder="Here are their previous posts:"></textarea>

    <label for="fallback-message">Fallback Message</label>
    <textarea id="fallback-message" placeholder="No previous posts found."></textarea>

    <div>
      <label for="enable-wafflebot">Enable WaffleBot</label>
      <input type="checkbox" id="enable-wafflebot" checked />
    </div>

    <button type="submit" class="button">Save Settings</button>
  </form>
</main>
</body>
</html>
