<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configure UpdateMe Bot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <nav class="container">
    <div class="logo"><strong>ModBot.io</strong></div>
    <div class="nav-links">
      <a href="bots.html">Back to Bots</a>
    </div>
  </nav>
</header>
<main class="container">
  <h1>UpdateMe Bot Configuration</h1>
  <form>
    <label for="subscription-message">Subscription Confirmation Message</label>
    <textarea id="subscription-message" placeholder="e.g. You'll get updates when new posts arrive..."></textarea>
    <label for="max-subscribers">Max Subscribers</label>
    <input type="number" id="max-subscribers" value="100" />
    <button type="submit" class="button">Save Settings</button>
  </form>
</main>
</body>
</html>
