<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ModBot.io – Activate Free Trial</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <header>
    <nav class="container">
      <strong>ModBot.io</strong>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="bots.html">Bots</a>
        <a href="settings.html">Settings</a>
        <a href="login.html">Login</a>
      </div>
    </nav>
  </header>

  <main class="container">
    <h1>Activate Your Free Trial</h1>
    <p>Fill out the form below to get started—no credit card required.</p>

    <form>
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="you@example.com" required />

      <label for="subreddit">Subreddit to Moderate</label>
      <input type="text" id="subreddit" placeholder="e.g. r/YourSubreddit" required />

      <label for="password">Create a Password</label>
      <input type="password" id="password" placeholder="••••••••" required />

      <label for="plan">Selected Plan</label>
      <select id="plan">
        <option>7-Day Free Trial (WaffleBot + WelcomeBot)</option>
      </select>

      <button type="submit" class="button" style="margin-top: 1em;">
        Start My Free Trial
      </button>
    </form>

    <p style="margin-top: 1em;"><em>After 7 days you’ll get 50% off your first month, then regular pricing applies.</em></p>
  </main>
</body>
</html>
