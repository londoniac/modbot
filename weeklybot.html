<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configure Weekly Stats Bot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
  <nav class="container">
    <div class="logo"><strong>ModBot.io</strong></div>
    <div class="nav-links">
      <a href="bots.html">Back to Bots</a>
    </div>
  </nav>
</header>
<main class="container">
  <h1>Weekly Stats Bot Configuration</h1>
  <form>
    <label for="report-day">Report Day of Week</label>
    <input type="text" id="report-day" value="Monday" />
    <label for="top-count">Number of Top Posts</label>
    <input type="number" id="top-count" value="5" />
    <button type="submit" class="button">Save Settings</button>
  </form>
</main>
</body>
</html>
